<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TokoDita</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fff7fb;
            color: #593448;
        }

        header {
            background: #f8c8df;
            padding: 20px 8%;
            color: #8e285f;
        }

        header h1 {
            font-size: 25px;
        }

        main {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .kotak {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #e8c6d8;
        }

        h2 {
            color: #8e285f;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #efc3da;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .daftar {
            background: #fff4f9;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            line-height: 2;
        }

        .total {
            color: #d63391;
            font-weight: 700;
            font-size: 19px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #d94694;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #a82b70;
        }

        footer {
            background: #8e285f;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>TokoDita ♡</h1>
</header>

<main>
    <div class="kotak">
        <h2>📝 Form Pemesanan</h2>

        <h3>Ringkasan Belanja</h3>
        <div class="daftar" id="ringkasan"></div>

        <form id="formCheckout">

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" required placeholder="Masukkan nama kamu">

            <label for="telepon">Nomor HP</label>
            <input type="tel" id="telepon" required placeholder="Masukkan nomor HP">

            <label for="alamat">Alamat Pengiriman</label>
            <textarea id="alamat" required placeholder="Masukkan alamat lengkap"></textarea>

            <label for="pembayaran">Metode Pembayaran</label>
            <select id="pembayaran" required>
                <option value="">Pilih metode pembayaran</option>
                <option value="COD">COD (Bayar di Tempat)</option>
                <option value="Transfer Bank">Transfer Bank</option>
                <option value="E-Wallet">E-Wallet</option>
            </select>

            <button type="submit">Buat Pesanan Sekarang ♡</button>

        </form>
    </div>
</main>

<footer>
    <p>© 2026 TokoDita. Made with ♡</p>
</footer>

<script>
    const keranjang = JSON.parse(
        localStorage.getItem("keranjang")
    ) || [];

    function rupiah(angka) {
        return "Rp" + angka.toLocaleString("id-ID");
    }

    const ringkasan = document.getElementById("ringkasan");

    let total = keranjang.reduce(
        (sum, item) => sum + item.harga * item.jumlah, 0
    );

    if (keranjang.length === 0) {
        ringkasan.innerHTML = "Keranjang masih kosong. Silakan pilih produk dahulu.";
        document.querySelector("button").disabled = true;
    } else {
        ringkasan.innerHTML = keranjang.map(item => `
            <p>${item.nama} × ${item.jumlah}
            — ${rupiah(item.harga * item.jumlah)}</p>
        `).join("") + `
            <p class="total">Total: ${rupiah(total)}</p>
        `;
    }

    document.getElementById("formCheckout").addEventListener("submit", function(event) {
        event.preventDefault();

        if (keranjang.length === 0) {
            alert("Keranjang masih kosong!");
            return;
        }

        let pesanan = JSON.parse(
            localStorage.getItem("pesanan")
        ) || [];

        let pesananBaru = {
            id: "TD" + Date.now(),
            tanggal: new Date().toLocaleString("id-ID"),
            nama: document.getElementById("nama").value,
            telepon: document.getElementById("telepon").value,
            alamat: document.getElementById("alamat").value,
            pembayaran: document.getElementById("pembayaran").value,
            produk: keranjang,
            total: total,
            status: "Menunggu Konfirmasi"
        };

        pesanan.push(pesananBaru);

        localStorage.setItem("pesanan", JSON.stringify(pesanan));

        localStorage.removeItem("keranjang");

        alert("Pesanan berhasil dibuat! 💗");

        window.location.href = "pesanan.html";
    });
</script>

</body>
</html>
